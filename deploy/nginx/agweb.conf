# HTTP site for IP-first or pre-certificate setup.
# After DNS exists, run certbot --nginx and keep this as the HTTP→HTTPS redirect host.

upstream agweb_contact {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/agweb/out;
    index index.html;

    include /etc/nginx/snippets/agweb-headers.conf;

    location ^~ /api/contact {
        proxy_pass http://agweb_contact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://agweb_contact/health;
    }

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location ^~ /deploy/ {
        deny all;
    }

    location ^~ /server/ {
        deny all;
    }
}
